# openspec/config.yaml — SDD project config (generated by sdd-init)
schema: spec-driven

context: |
  AutoMisho (compra_coches) — AI copilot for buying used cars in Spain.
  Stack: Next.js 16 (App Router) + React 19 + TypeScript 6 (strict) + Prisma 7 (PostgreSQL)
  + NextAuth v5 beta + Stripe + AI SDK (openai-compatible) + Tailwind v4 + Framer Motion/GSAP/Lenis
  Backend: FastAPI scrapers (AutoScout24, coches.net, Wallapop, DGT, CarVertical, CarFax) in server/
  Design: Hyper Foundation (dark emerald, mint glow #97fcd7, Teodor+Inter, pill 60px) —
  see front/.opencode/DESIGN.md; tokens applied in front/src/app/globals.css @theme.
  Repo layout: front/ and server/ siblings, no root package.json, git root at project root.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (App Router route groups, @/ alias, lib/ infra modules)
      - Respect Hyper Foundation design tokens for any UI work
    tdd: false
    test_command: "npm test --prefix front"
  verify:
    test_command: "npm test --prefix front"
    build_command: "npm run build --prefix front"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas