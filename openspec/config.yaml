# openspec/config.yaml — SDD project config (generated by sdd-init)
# Updated: 2026-09-16 — strict_tdd enabled for server (FastAPI/Python agentic backend)
schema: spec-driven

context: |
  AutoMisho (compra_coches) — AI copilot for buying used cars in Spain.
  Stack: Next.js 16 (App Router) + React 19 + TypeScript 6 (strict) + Prisma 7 (PostgreSQL)
  + NextAuth v5 beta + Stripe + AI SDK (openai-compatible) + Tailwind v4 + Framer Motion/GSAP/Lenis
  Backend: FastAPI scrapers (AutoScout24, coches.net, Wallapop, DGT, CarVertical, CarFax) in server/
  Agentic orchestrator layer planned for server/ — strict TDD enforced from this session.
  Design: Hyper Foundation (dark emerald, mint glow #97fcd7, Teodor+Inter, pill 60px) —
  see front/.opencode/DESIGN.md; tokens applied in front/src/app/globals.css @theme.
  Repo layout: front/ and server/ siblings, no root package.json, git root at project root.

projects:
  front:
    root: front/
    stack: Next.js 16 / React 19 / TypeScript / Prisma / Tailwind v4
    test_runner: jest
    test_command: "npm test"
    test_watch_command: "npm run test:watch"
    test_framework: Jest 30 + ts-jest + @testing-library/react
    test_env: jsdom
    strict_tdd: false
    lint_command: "npm run lint"
    build_command: "npm run build"
    notes: >
      TDD non-enforced for front — Jest/RTL available for unit/integration.
      No workspace-level runner covers both projects simultaneously;
      strict_tdd kept false to avoid blocking front-only tasks.

  server:
    root: server/
    stack: Python / FastAPI 0.115 / Pydantic v2 / httpx / BeautifulSoup4 / google-genai
    test_runner: pytest
    test_command: "python -m pytest"
    test_watch_command: "python -m pytest --tb=short -q"
    test_framework: pytest (to be installed) + pytest-asyncio + httpx[http2]
    test_env: asyncio
    strict_tdd: true
    notes: >
      Strict TDD enforced for all server/ work — agentic orchestrator layer requires
      red-green-refactor discipline. pytest not yet installed; must add to requirements.txt
      before first TDD task. Bootstrap command: pip install pytest pytest-asyncio httpx[http2]
      Test layout: server/tests/ (unit/) and (integration/) per service module.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (App Router route groups, @/ alias, lib/ infra modules)
      - Respect Hyper Foundation design tokens for any UI work
      - For server/ tasks: write failing test FIRST, then implement (strict TDD)
    tdd: false
    test_command: "npm test --prefix front"
    server_tdd: true
    server_test_command: "python -m pytest"
    server_test_cwd: "server/"
  verify:
    test_command: "npm test --prefix front"
    build_command: "npm run build --prefix front"
    server_test_command: "python -m pytest"
    server_test_cwd: "server/"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  workspace_strict_tdd: false
  rationale: >
    No single command covers both front/ and server/ simultaneously.
    Per-project TDD applied: server strict_tdd=true, front strict_tdd=false.
  layers:
    front:
      unit: jest *.test.tsx? in src/
      integration: RTL + jsdom
      e2e: not configured
    server:
      unit: pytest server/tests/unit/
      integration: pytest server/tests/integration/ (httpx TestClient)
      e2e: not configured
  blockers:
    - pytest not installed in server/.venv — must run: pip install pytest pytest-asyncio httpx[http2]
    - server/tests/ directory does not exist yet — sdd-apply must bootstrap it
