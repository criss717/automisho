<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#323242" />
      <stop offset="50%" stop-color="#282834" />
      <stop offset="100%" stop-color="#1f1f29" />
    </linearGradient>
    <linearGradient id="metalHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a4c" />
      <stop offset="50%" stop-color="#2c2c3c" />
      <stop offset="100%" stop-color="#22222f" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5bc2f2" />
      <stop offset="60%" stop-color="#0081c0" />
      <stop offset="100%" stop-color="#171722" />
    </radialGradient>
    <filter id="eyeGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- TAIL -->
  <g>
    <path d="M85 200 C60 210, 40 190, 50 170 C60 150, 45 140, 55 125 C65 110, 50 100, 60 90" stroke="#41a1cf" stroke-width="3" fill="none" stroke-linecap="round" />
    <polygon points="57,86 63,83 69,86 69,92 63,95 57,92" fill="#282834" stroke="#41a1cf" stroke-width="1.5" />
  </g>

  <!-- BODY -->
  <g id="body">
    <rect x="90" y="150" width="100" height="70" rx="20" fill="url(#metalBody)" stroke="#dee2de" stroke-width="1.5" />
    <line x1="110" y1="155" x2="110" y2="215" stroke="#1f1f29" stroke-width="1" opacity="0.4" />
    <line x1="140" y1="155" x2="140" y2="215" stroke="#1f1f29" stroke-width="1" opacity="0.4" />
    <line x1="170" y1="155" x2="170" y2="215" stroke="#1f1f29" stroke-width="1" opacity="0.4" />

    <!-- Central rotating gear -->
    <g transform="translate(140, 185)">
      <g>
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(0)" />
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(45)" />
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(90)" />
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(135)" />
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(180)" />
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(225)" />
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(270)" />
        <rect x="-3" y="-14" width="6" height="6" rx="1" fill="#41a1cf" transform="rotate(315)" />
        <circle r="10" fill="#1f1f29" stroke="#41a1cf" stroke-width="1.5" />
        <circle r="3" fill="#41a1cf" />
      </g>
    </g>

    <!-- Bolts on body -->
    <g>
      <circle cx="100" cy="160" r="3" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="100" cy="160" r="1" fill="#41a1cf" opacity="0.8" />
      <circle cx="180" cy="160" r="3" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="180" cy="160" r="1" fill="#41a1cf" opacity="0.8" />
      <circle cx="100" cy="210" r="3" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="100" cy="210" r="1" fill="#41a1cf" opacity="0.8" />
      <circle cx="180" cy="210" r="3" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="180" cy="210" r="1" fill="#41a1cf" opacity="0.8" />
    </g>
  </g>

  <!-- LEGS -->
  <g id="legs">
    <g>
      <rect x="100" y="215" width="12" height="30" rx="4" fill="url(#metalBody)" stroke="#dee2de" stroke-width="1" />
      <circle cx="106" cy="230" r="4" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="106" cy="230" r="1.5" fill="#41a1cf" />
      <rect x="98" y="242" width="16" height="8" rx="4" fill="#282834" stroke="#41a1cf" stroke-width="1" />
    </g>
    <g>
      <rect x="130" y="215" width="12" height="30" rx="4" fill="url(#metalBody)" stroke="#dee2de" stroke-width="1" />
      <circle cx="136" cy="230" r="4" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="136" cy="230" r="1.5" fill="#41a1cf" />
      <rect x="128" y="242" width="16" height="8" rx="4" fill="#282834" stroke="#41a1cf" stroke-width="1" />
    </g>
    <g>
      <rect x="155" y="215" width="12" height="30" rx="4" fill="url(#metalBody)" stroke="#dee2de" stroke-width="1" />
      <circle cx="161" cy="230" r="4" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="161" cy="230" r="1.5" fill="#41a1cf" />
      <rect x="153" y="242" width="16" height="8" rx="4" fill="#282834" stroke="#41a1cf" stroke-width="1" />
    </g>
    <g>
      <rect x="175" y="215" width="12" height="30" rx="4" fill="url(#metalBody)" stroke="#dee2de" stroke-width="1" />
      <circle cx="181" cy="230" r="4" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="181" cy="230" r="1.5" fill="#41a1cf" />
      <rect x="173" y="242" width="16" height="8" rx="4" fill="#282834" stroke="#41a1cf" stroke-width="1" />
    </g>
  </g>

  <!-- HEAD -->
  <g id="head">
    <!-- Neck -->
    <rect x="125" y="130" width="30" height="25" rx="8" fill="url(#metalBody)" stroke="#dee2de" stroke-width="1" />
    <circle cx="133" cy="142" r="2.5" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
    <circle cx="147" cy="142" r="2.5" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />

    <!-- Head Ellipse -->
    <ellipse cx="140" cy="105" rx="48" ry="40" fill="url(#metalHead)" stroke="#dee2de" stroke-width="1.5" />
    <path d="M140 70 L140 65" stroke="#41a1cf" stroke-width="1" opacity="0.5" />
    <path d="M110 85 L105 82" stroke="#41a1cf" stroke-width="1" opacity="0.5" />
    <path d="M170 85 L175 82" stroke="#41a1cf" stroke-width="1" opacity="0.5" />

    <!-- EARS -->
    <g>
      <path d="M105 75 L95 45 L120 65 Z" fill="url(#metalHead)" stroke="#dee2de" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="107" cy="62" r="3" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="107" cy="62" r="1" fill="#41a1cf" opacity="0.9" />
      <line x1="103" y1="52" x2="111" y2="52" stroke="#41a1cf" stroke-width="1.5" />
    </g>
    <g>
      <path d="M175 75 L185 45 L160 65 Z" fill="url(#metalHead)" stroke="#dee2de" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="173" cy="62" r="3" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
      <circle cx="173" cy="62" r="1" fill="#41a1cf" opacity="0.9" />
      <line x1="169" y1="52" x2="177" y2="52" stroke="#41a1cf" stroke-width="1.5" />
    </g>

    <!-- FOREHEAD GEAR -->
    <g transform="translate(140, 82)">
      <g>
        <rect x="-2" y="-8" width="4" height="4" rx="0.5" fill="#41a1cf" transform="rotate(0)" />
        <rect x="-2" y="-8" width="4" height="4" rx="0.5" fill="#41a1cf" transform="rotate(60)" />
        <rect x="-2" y="-8" width="4" height="4" rx="0.5" fill="#41a1cf" transform="rotate(120)" />
        <rect x="-2" y="-8" width="4" height="4" rx="0.5" fill="#41a1cf" transform="rotate(180)" />
        <rect x="-2" y="-8" width="4" height="4" rx="0.5" fill="#41a1cf" transform="rotate(240)" />
        <rect x="-2" y="-8" width="4" height="4" rx="0.5" fill="#41a1cf" transform="rotate(300)" />
        <circle r="5" fill="#1f1f29" stroke="#41a1cf" stroke-width="1" />
        <circle r="1.5" fill="#41a1cf" opacity="0.8" />
      </g>
    </g>

    <!-- EYES (Centered) -->
    <g id="eyes">
      <!-- LEFT EYE -->
      <g transform="translate(122, 101)">
        <circle cx="0" cy="0" r="13" fill="#171722" stroke="#dee2de" stroke-width="1.5" />
        <circle cx="0" cy="0" r="10" fill="url(#eyeGlow)" filter="url(#eyeGlowFilter)" />
        <circle cx="0" cy="0" r="4.2" fill="#0d0d15" />
        <circle cx="-2" cy="-2" r="1.6" fill="#ffffff" opacity="0.9" />
      </g>
      <!-- RIGHT EYE -->
      <g transform="translate(158, 101)">
        <circle cx="0" cy="0" r="13" fill="#171722" stroke="#dee2de" stroke-width="1.5" />
        <circle cx="0" cy="0" r="10" fill="url(#eyeGlow)" filter="url(#eyeGlowFilter)" />
        <circle cx="0" cy="0" r="4.2" fill="#0d0d15" />
        <circle cx="-2" cy="-2" r="1.6" fill="#ffffff" opacity="0.9" />
      </g>
    </g>

    <!-- NOSE -->
    <g transform="translate(140, 118)">
      <polygon points="0,-6 5.2,-3 5.2,3 0,6 -5.2,3 -5.2,-3" fill="#282834" stroke="#41a1cf" stroke-width="1.5" />
      <circle r="2" fill="#41a1cf" opacity="0.8" />
    </g>

    <!-- WHISKERS -->
    <g opacity="0.85">
      <line x1="115" y1="115" x2="80" y2="108" stroke="#41a1cf" stroke-width="1" stroke-linecap="round" />
      <line x1="115" y1="120" x2="78" y2="120" stroke="#41a1cf" stroke-width="1" stroke-linecap="round" />
      <line x1="115" y1="125" x2="80" y2="132" stroke="#41a1cf" stroke-width="1" stroke-linecap="round" />
      <line x1="165" y1="115" x2="200" y2="108" stroke="#41a1cf" stroke-width="1" stroke-linecap="round" />
      <line x1="165" y1="120" x2="202" y2="120" stroke="#41a1cf" stroke-width="1" stroke-linecap="round" />
      <line x1="165" y1="125" x2="200" y2="132" stroke="#41a1cf" stroke-width="1" stroke-linecap="round" />
    </g>
  </g>

  <!-- Floor shadow -->
  <ellipse cx="140" cy="260" rx="46" ry="7" fill="rgba(40,40,52,0.08)" />
</svg>
